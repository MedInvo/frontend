
name: CI/CD - MedInvo Frontend

on:
  push:
    branches:
      - develop
      - "release/**"

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:
    inputs:
      ref:
        description: "Branch to build and publish (must match selected branch)"
        required: true
        default: develop
        type: string

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: pharma-medinvo-dev-frontend

jobs:
  # 1. Frontend unit tests and coverage
  test:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@FULL_SHA_CHECKOUT # Replace with verified 40-character SHA

      - name: Setup Node.js
        uses: actions/setup-node@FULL_SHA_SETUP_NODE # Replace with verified 40-character SHA
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: npm test -- --coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@FULL_SHA_UPLOAD_ARTIFACT # Replace with verified 40-character SHA
        with:
          name: frontend-coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 3

  # 2. SonarCloud quality gate and dependency audit
  sonar:
    name: SonarCloud Quality
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@FULL_SHA_CHECKOUT # Replace with verified 40-character SHA
        with:
          fetch-depth: 0

      - name: Download coverage report
        uses: actions/download-artifact@FULL_SHA_DOWNLOAD_ARTIFACT # Replace with verified 40-character SHA
        with:
          name: frontend-coverage
          path: coverage/

      - name: Setup Node.js
        uses: actions/setup-node@FULL_SHA_SETUP_NODE # Replace with verified 40-character SHA
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Java
        uses: actions/setup-java@FULL_SHA_SETUP_JAVA # Replace with verified 40-character SHA
        with:
          distribution: temurin
          java-version: "21"

      - name: SonarCloud Scan and Quality Gate
        uses: SonarSource/sonarqube-scan-action@FULL_SHA_SONAR_SCAN # Replace with verified 40-character SHA
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORG }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY_FRONTEND }}
            -Dsonar.sources=src
            -Dsonar.tests=src
            -Dsonar.test.inclusions=**/*.test.js,**/*.test.jsx
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
            -Dsonar.scanner.skipJreProvisioning=true

      - name: npm audit
        run: npm audit --audit-level=high

  # 3. Production build
  build:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: [test, sonar]

    steps:
      - name: Checkout
        uses: actions/checkout@FULL_SHA_CHECKOUT # Replace with verified 40-character SHA

      - name: Setup Node.js
        uses: actions/setup-node@FULL_SHA_SETUP_NODE # Replace with verified 40-character SHA
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@FULL_SHA_UPLOAD_ARTIFACT # Replace with verified 40-character SHA
        with:
          name: frontend-dist
          path: dist/
          if-no-files-found: error
          retention-days: 3

  # 4. Build, scan and push Docker image
  docker-build-scan-push:
    name: Docker Build, Trivy Scan and ECR Push
    runs-on: ubuntu-latest
    needs: build

    if: >-
      (github.event_name == 'push' &&
       (github.ref == 'refs/heads/develop' ||
        startsWith(github.ref, 'refs/heads/release/'))) ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == format('refs/heads/{0}', inputs.ref) &&
       (github.ref == 'refs/heads/develop' ||
        startsWith(github.ref, 'refs/heads/release/')))

    permissions:
      contents: read
      id-token: write

    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@FULL_SHA_CHECKOUT # Replace with verified 40-character SHA

      - name: Set image tag
        id: tag
        run: echo "image_tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@FULL_SHA_AWS_CREDENTIALS # Replace with verified 40-character SHA
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Verify ECR repository
        run: |
          aws ecr describe-repositories \
            --region "$AWS_REGION" \
            --repository-names "$ECR_REPOSITORY"

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@FULL_SHA_ECR_LOGIN # Replace with verified 40-character SHA

      - name: Build Docker image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.tag.outputs.image_tag }}
        run: |
          docker build --pull \
            -t "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@FULL_SHA_TRIVY # Replace with verified 40-character SHA
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.tag.outputs.image_tag }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Push image to ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.tag.outputs.image_tag }}
        run: |
          docker push "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
